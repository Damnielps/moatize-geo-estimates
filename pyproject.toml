[project]
name = "tete-moatize"
version = "0.1.0"
description = "Urbanização induzida pela mineração em Tete e Moatize (Moçambique), 1997-2025"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }

dependencies = [
  # núcleo numérico e tabular
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  # raster e vetor
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "xarray>=2024.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fiona>=1.9",
  # rota STAC (§11.3 — rota de referência, sem GEE)
  "pystac-client>=0.8",
  "odc-stac>=0.3.9",
  "stackstac>=0.5",
  "planetary-computer>=1.0",
  "dask[array]>=2024.4",
  # classificação (§5.1, §5.6.1)
  "scikit-learn>=1.4",
  # métricas de forma urbana (§5.2)
  "pylandstats>=3.0",
  # desenho causal (§5.4)
  "statsmodels>=0.14",
  "linearmodels>=6",
  # figuras (§5, pipeline/04_figures)
  "matplotlib>=3.8",
  # utilitários de coleta
  "requests>=2.31",
  # explícito, não transitivo: o host do DLR (WSF Evolution) encadeia até uma raiz
  # ausente do cafile padrão do OpenSSL deste ambiente, e fetch_wsf_evolution.py
  # depende de certifi.where(). Como dependência transitiva, sumiria numa reresolução.
  "certifi>=2024.2",
  "tqdm>=4.66",
  "openpyxl>=3.1",
  "lxml>=5",
  "pypdf>=4",
  "html5lib>=1.1",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
gee = ["earthengine-api>=1.1"]   # rota (a), opcional; exige conta Google

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Conjunto de regras FIXADO explicitamente (§11.2.1: nenhuma etapa depende de
# estado de sessão — nem o lint). Sem `select`, o ruff aplica o seu conjunto
# padrão, que muda entre versões e pode ser sobreposto por configuração do
# usuário fora do repositório: a CI e a máquina do autor divergiriam.
[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "DTZ",       # datetime sem fuso — datas de acesso entram em PROVENANCE.md
  "PLW1510",   # subprocess.run sem check: falha de download passaria silenciosa
  "RUF",
]
ignore = [
  # O projeto é redigido em português e usa travessão e meia-risca de propósito
  # (Tete–Moatize, 1997–2025, maio–outubro). RUF001-003 tratariam isso como erro.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Vendorizado sem alteração de ardosia-brand-guidelines/scripts/palette.py (skill
# pessoal do autor, fora do repositório) — ver docstring do arquivo. Lint de estilo
# aplicado à fonte normativa quebraria a garantia de "sem alteração".
"pipeline/04_figures/_paleta_ardosia.py" = ["E741", "I001"]
